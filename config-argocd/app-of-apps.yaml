apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps-application
  namespace: argocd
spec:
  destination:
    namespace: argocdd
    server: https://kubernetes.default.svc
  project: app-of-apps
  sources:
    - path: charts/guestbook-new/chart/guestbook/argo
      repoURL: git@github.com:danny-zh/k8s-admin.git
      targetRevision: HEAD
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - LastPrune=true
    - ApplyOutOfSyncOnly=true
